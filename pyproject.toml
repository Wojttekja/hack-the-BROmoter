[project]
name = "hack-the-bromoter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Wojttekja", email = "mierzejekwojciech@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "polars>=1.44.1",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "torch>=2.13.0",
]

[project.scripts]
hack-the-bromoter = "hack_the_bromoter:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
