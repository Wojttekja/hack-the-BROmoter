[project]
name = "hack-the-bromoter"
version = "0.1.0"
description = "Black-box promoter optimization scaffold for the HYPPE hackathon"
readme = "README.md"
authors = [
    { name = "Wojttekja", email = "mierzejekwojciech@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "biopython>=1.88",
    "cma>=3.3",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "polars>=1.44.1",
    "rich>=13.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.11",
    "torch>=2.13.0",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["promo"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
# D417: *args/**kwargs need not be individually documented in Google style.
ignore = ["D203", "D213", "D417"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests: relax docstring requirements on helper classes/methods.
"tests/*" = ["D101", "D102", "D103", "D105", "D107"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
